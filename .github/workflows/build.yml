# Compila as 4 placas em cada pull request (sem segredos: so confere que o codigo compila).
name: Compilar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ESP32_CORE: esp32:esp32@3.3.11

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: s3-35
            flag: ""
            fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=4M,PartitionScheme=min_spiffs,PSRAM=opi
          - board: esp32-devkit
            flag: ESP32_DEVKIT
            fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
          - board: s3-headless
            flag: S3_HEADLESS
            fqbn: esp32:esp32:esp32s3:PartitionScheme=min_spiffs,CDCOnBoot=cdc
          - board: c3-headless
            flag: C3_HEADLESS
            fqbn: esp32:esp32:esp32c3:PartitionScheme=min_spiffs,CDCOnBoot=cdc
    name: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: breww_controller # pasta precisa ter o mesmo nome do .ino

      - uses: arduino/setup-arduino-cli@v2

      - name: Core ESP32 e bibliotecas (versoes fixas)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "$ESP32_CORE"
          arduino-cli lib install "lvgl@8.4.0" "GFX Library for Arduino@1.6.7" "ArduinoJson@7.4.3" \
            "PubSubClient@2.8" "OneWire@2.3.8" "DallasTemperature@4.0.6" "DHT sensor library@1.4.7" \
            "Adafruit Unified Sensor@1.1.15" "AutoPID@1.0.3" "U8g2@2.36.19"
          cp breww_controller/ci/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"

      - name: Compilar ${{ matrix.board }}
        env:
          FLAG: ${{ matrix.flag }}
          FQBN: ${{ matrix.fqbn }}
        run: |
          if [ -n "$FLAG" ]; then
            arduino-cli compile --fqbn "$FQBN" \
              --build-property "compiler.cpp.extra_flags=-DBREWW_BOARD_$FLAG" \
              --build-property "compiler.c.extra_flags=-DBREWW_BOARD_$FLAG" \
              --output-dir build breww_controller
          else
            arduino-cli compile --fqbn "$FQBN" --output-dir build breww_controller
          fi
