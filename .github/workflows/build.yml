# Compila as 5 placas (4 ESP32 + ESP8266 Lite) em cada pull request (sem segredos: so confere que o codigo compila).
name: Compilar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ESP32_CORE: esp32:esp32@3.3.11
  ESP8266_CORE: esp8266:esp8266@3.1.2

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: s3-35
            flag: ""
            fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashMode=qio,FlashSize=4M,PartitionScheme=min_spiffs,PSRAM=opi
          - board: esp32-devkit
            flag: ESP32_DEVKIT
            fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
          - board: s3-headless
            flag: S3_HEADLESS
            fqbn: esp32:esp32:esp32s3:PartitionScheme=min_spiffs,CDCOnBoot=cdc
          - board: c3-headless
            flag: C3_HEADLESS
            fqbn: esp32:esp32:esp32c3:PartitionScheme=min_spiffs,CDCOnBoot=cdc
          - board: esp8266-lite
            flag: ESP8266_LITE
            fqbn: esp8266:esp8266:nodemcuv2:eesz=4M1M,xtal=160
    name: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: breww_controller # pasta precisa ter o mesmo nome do .ino

      # arduino-cli direto (a action arduino/setup-arduino-cli ainda roda em Node 20)
      - name: Instalar arduino-cli 1.5.1
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/v1.5.1/install.sh | BINDIR="$HOME/.local/bin" sh -s 1.5.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Core ESP32 e bibliotecas (versoes fixas)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install "$ESP32_CORE"
          arduino-cli core install "$ESP8266_CORE"
          arduino-cli lib install "lvgl@8.4.0" "GFX Library for Arduino@1.6.7" "ArduinoJson@7.4.3" \
            "PubSubClient@2.8" "OneWire@2.3.8" "DallasTemperature@4.0.6" "DHT sensor library@1.4.7" \
            "Adafruit Unified Sensor@1.1.15" "AutoPID@1.0.3" "U8g2@2.36.19"
          cp breww_controller/ci/lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"

      - name: Compilar ${{ matrix.board }}
        env:
          FLAG: ${{ matrix.flag }}
          FQBN: ${{ matrix.fqbn }}
        run: |
          if [ -n "$FLAG" ]; then
            arduino-cli compile --fqbn "$FQBN" \
              --build-property "compiler.cpp.extra_flags=-DBREWW_BOARD_$FLAG" \
              --build-property "compiler.c.extra_flags=-DBREWW_BOARD_$FLAG" \
              --output-dir build breww_controller
          else
            arduino-cli compile --fqbn "$FQBN" --output-dir build breww_controller
          fi
